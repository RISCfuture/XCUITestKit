name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and Test
    # XCUITestKit links XCUIApplication/XCUIElement, which ship with Xcode's
    # XCTest — not the swift.org toolchain or Linux — so build with the runner's
    # Xcode rather than SwiftyLab/setup-swift, and skip the Linux matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  lint:
    name: Run Swiftlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: norio-nomura/action-swiftlint@3.2.1
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O .swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: swift format lint -r .
