name: Set up iOS simulator
description: >
  Disable background services, select Xcode, ensure an iOS runtime supporting the
  device type is present, then create, boot, configure, and settle a fresh
  simulator on it. Captures the simulator-setup boilerplate that iOS UI-test
  workflows each copy-paste, plus a LaunchServices-migration settle gate so
  install/launch does not race a still half-booted device.

inputs:
  device:
    description: Human-readable simulator name (also the created device name).
    required: true
  device-type:
    description: SimDeviceType identifier, e.g. com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
    required: true
  os-version:
    description: iOS version, e.g. "18.5". Empty string means the version of the selected Xcode's iOS SDK.
    required: false
    default: ""
  xcode-version:
    description: Xcode to select.
    required: false
    default: latest-stable
  raise-pty-cap:
    description: Raise kern.tty.ptmx_max to 999 (recommended for long UI suites).
    required: false
    default: "false"
  connect-hardware-keyboard:
    description: Connect a hardware keyboard (needed for the iPad Cmd+A select-all path).
    required: false
    default: "false"

outputs:
  udid:
    description: UDID of the booted, configured simulator.
    value: ${{ steps.sim.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Disable background services
      shell: bash
      run: |
        sudo mdutil -a -i off
        sudo launchctl bootout system/com.apple.metadata.mds 2>/dev/null || true
        if [ "${{ inputs.raise-pty-cap }}" = "true" ]; then
          # xcodebuild allocates a PTY per test launch and never reclaims them;
          # the macOS default of 127 starves out long UI test suites.
          sudo sysctl -w kern.tty.ptmx_max=999 || true
        fi
    - uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: ${{ inputs.xcode-version }}
    - name: Ensure iOS simulator runtime
      id: runtime
      shell: bash
      env:
        DEVICE_TYPE: ${{ inputs.device-type }}
        OS_VERSION: ${{ inputs.os-version }}
      run: |
        SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
        VERSION=${OS_VERSION:-$SDK_VERSION}

        supporting_runtime() {
          xcrun simctl list runtimes -j |
            jq -r --arg type "$DEVICE_TYPE" --arg version "$VERSION" '
              first(.runtimes[]
                | select(.platform == "iOS" and .isAvailable and .version == $version)
                | select(any(.supportedDeviceTypes[]; .identifier == $type))
              ).identifier'
        }

        installed_builds() {
          xcrun simctl list runtimes -j | jq '[.runtimes[].buildversion]'
        }

        # A device introduced in an earlier point release of the SDK's major version can run
        # only on a device-specific runtime build. The download index does not say which build
        # serves which device, so this is judged from the device type's minimum version.
        needs_device_specific_runtime() {
          xcrun simctl list devicetypes -j |
            jq --arg type "$DEVICE_TYPE" --arg sdk "$SDK_VERSION" '
              def components: split(".") | map(tonumber);
              (first(.devicetypes[] | select(.identifier == $type)).minRuntimeVersionString // "0")
              | components as $min | ($sdk | components) as $sdk
              | $min[0] == $sdk[0] and $min < $sdk'
        }

        # The runtime builds Apple offers for this Xcode's iOS SDK that are not yet installed:
        # the preferred build first, unless the device needs a device-specific build, which
        # `xcodebuild -downloadPlatform` fetches only when asked for by build. Builds outside
        # the SDK's group come last.
        sdk_runtime_builds() {
          curl -fsSL https://devimages-cdn.apple.com/downloads/xcode/simulators/index2.dvtdownloadableindex |
            plutil -convert json -o - - |
            jq -r --arg sdk "$(xcrun --sdk iphoneos --show-sdk-build-version)" \
              --argjson installed "$(installed_builds)" \
              --argjson specific "$(needs_device_specific_runtime)" '
              [.sdkToSimulatorMappings[]
                | select(.sdkBuildUpdate == $sdk)
                | select(.simulatorBuildUpdate | IN($installed[]) | not)]
              | sort_by([(.affinity == "preferred") == $specific, .groupTag == "none"])
              | .[].simulatorBuildUpdate'
        }

        downloadable_builds() {
          if [ "$VERSION" = "$SDK_VERSION" ]; then
            sdk_runtime_builds
          else
            echo "$VERSION"
          fi
        }

        RUNTIME_ID=$(supporting_runtime)
        if [ -z "$RUNTIME_ID" ]; then
          for build in $(downloadable_builds); do
            echo "No iOS $VERSION runtime supports $DEVICE_TYPE, downloading iOS $build..."
            xcodebuild -downloadPlatform iOS -buildVersion "$build" || continue
            RUNTIME_ID=$(supporting_runtime)
            [ -n "$RUNTIME_ID" ] && break
          done
        fi
        if [ -z "$RUNTIME_ID" ]; then
          echo "::error::No iOS $VERSION simulator runtime supports $DEVICE_TYPE."
          exit 1
        fi
        echo "identifier=$RUNTIME_ID" >> "$GITHUB_OUTPUT"
        echo "Using runtime $RUNTIME_ID"
    - name: Create simulator
      id: sim
      shell: bash
      run: |
        while xcrun simctl delete "${{ inputs.device }}" 2>/dev/null; do :; done
        UDID=$(xcrun simctl create "${{ inputs.device }}" "${{ inputs.device-type }}" \
          "${{ steps.runtime.outputs.identifier }}")
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"
        echo "Created simulator ${{ inputs.device }} ($UDID)"
    - name: Boot, configure, and settle simulator
      shell: bash
      run: |
        UDID="${{ steps.sim.outputs.udid }}"
        xcrun simctl boot "$UDID" || true
        xcrun simctl bootstatus "$UDID" || true
        # bootstatus can return while com.apple.-0LaunchServicesMigrator is still
        # running, leaving the device only marginally responsive — the cause of
        # "AX loaded notification" timeouts, kAXErrorServerNotFound, and
        # xctrunner "Unknown application display identifier" on older runtimes.
        # Probe for responsiveness, then settle, before any install/launch.
        for _ in $(seq 1 30); do
          if xcrun simctl spawn "$UDID" launchctl print system >/dev/null 2>&1; then break; fi
          sleep 2
        done
        sleep 10
        xcrun simctl spawn "$UDID" defaults write -g AppleLocale en_US
        xcrun simctl spawn "$UDID" defaults write com.apple.Preferences KeyboardAutocorrection -bool false
        xcrun simctl spawn "$UDID" defaults write com.apple.Preferences KeyboardAutocapitalization -bool false
        xcrun simctl spawn "$UDID" defaults write com.apple.Preferences KeyboardPrediction -bool false
        if [ "${{ inputs.connect-hardware-keyboard }}" = "true" ]; then
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool YES
        else
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
        fi
        xcrun simctl status_bar "$UDID" override \
          --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
          --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
